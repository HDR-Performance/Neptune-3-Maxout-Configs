[gcode_macro SMART_PARK]
description: Safely park near the print area before final nozzle heating
gcode:
    {% set settings = printer["gcode_macro _KAMP_Settings"] %}
    {% set z_height = settings.smart_park_height|float %}
    {% set purge_margin = settings.purge_margin|float %}
    {% set verbose = settings.verbose_enable|abs %}
    {% set xmin = printer.toolhead.axis_minimum.x|float %}
    {% set ymin = printer.toolhead.axis_minimum.y|float %}
    {% set xmax = printer.toolhead.axis_maximum.x|float %}
    {% set ymax = printer.toolhead.axis_maximum.y|float %}
    {% set zmax = printer.toolhead.axis_maximum.z|float %}
    {% set center_x = (xmin + xmax) / 2.0 %}
    {% set center_y = (ymin + ymax) / 2.0 %}
    {% set all_points = printer.exclude_object.objects|map(attribute='polygon')|sum(start=[]) %}
    {% set objects_found = printer.exclude_object.objects|length > 0 %}
    {% set object_xmin = all_points|map(attribute=0)|min|default(center_x) %}
    {% set object_ymin = all_points|map(attribute=1)|min|default(center_y) %}

    {% if objects_found %}
        {% set park_x = object_xmin - purge_margin %}
        {% set park_y = object_ymin - purge_margin %}
    {% else %}
        {% set park_x = center_x %}
        {% set park_y = center_y %}
    {% endif %}

    {% set park_x = [[park_x, xmin + 5.0]|max, xmax - 5.0]|min %}
    {% set park_y = [[park_y, ymin + 5.0]|max, ymax - 5.0]|min %}
    {% set safe_z = [[printer.toolhead.position.z|float, z_height]|max, zmax - 1.0]|min %}

    {% if verbose %}
        {action_respond_info("Smart Park: X%.1f Y%.1f Z%.1f at 100 mm/s maximum XY travel." % (park_x, park_y, safe_z))}
    {% endif %}

    SAVE_GCODE_STATE NAME=SMART_PARK_STATE
    G90
    # Lift first. Do not combine a slow Z lift with a long XY move.
    G0 Z{safe_z} F600
    # Explicit 100 mm/s cap; independent of printer max_velocity.
    G0 X{park_x} Y{park_y} F6000
    RESTORE_GCODE_STATE NAME=SMART_PARK_STATE

