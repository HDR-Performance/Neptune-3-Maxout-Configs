[gcode_macro LINE_PURGE]
description: Adaptive purge line with bounded coordinates and travel speeds
gcode:
    {% set settings = printer["gcode_macro _KAMP_Settings"] %}
    {% set cross_section = printer.configfile.settings.extruder.max_extrude_cross_section|float %}
    {% set verbose = settings.verbose_enable|abs %}
    {% set purge_height = settings.purge_height|float %}
    {% set tip_distance = settings.tip_distance|float %}
    {% set purge_margin = settings.purge_margin|float %}
    {% set purge_amount = settings.purge_amount|float %}
    {% set flow_rate = settings.flow_rate|float %}
    {% set xmin = printer.toolhead.axis_minimum.x|float %}
    {% set ymin = printer.toolhead.axis_minimum.y|float %}
    {% set xmax = printer.toolhead.axis_maximum.x|float %}
    {% set ymax = printer.toolhead.axis_maximum.y|float %}
    {% set zmax = printer.toolhead.axis_maximum.z|float %}
    {% set center_x = (xmin + xmax) / 2.0 %}
    {% set all_points = printer.exclude_object.objects|map(attribute='polygon')|sum(start=[]) %}
    {% set objects_found = printer.exclude_object.objects|length > 0 %}
    {% set object_xmin = all_points|map(attribute=0)|min|default(center_x) %}
    {% set object_xmax = all_points|map(attribute=0)|max|default(center_x) %}
    {% set object_ymin = all_points|map(attribute=1)|min|default(ymin + purge_margin + 5.0) %}

    # Reserve 15 mm after the purge line for the string-breaking wipe.
    {% set x_low = xmin + 5.0 %}
    {% set x_high = xmax - purge_amount - 15.0 %}
    {% set requested_x = ((object_xmin + object_xmax) / 2.0) - (purge_amount / 2.0) %}
    {% set purge_x = [[requested_x, x_low]|max, x_high]|min %}
    {% set purge_y = [[object_ymin - purge_margin, ymin + 5.0]|max, ymax - 5.0]|min %}
    {% set purge_move_speed = (flow_rate / 5.0) * 60.0 %}
    {% set travel_z = [[printer.toolhead.position.z|float, purge_height + 5.0]|max, zmax - 1.0]|min %}

    {% if cross_section < 5.0 %}
        {action_raise_error("LINE_PURGE requires max_extrude_cross_section of at least 5.")}
    {% elif x_high < x_low %}
        {action_raise_error("Configured purge line is too long for the X travel range.")}
    {% else %}
        {% if verbose %}
            {action_respond_info("Line Purge: X%.1f to X%.1f at Y%.1f; XY travel capped at 100 mm/s." % (purge_x, purge_x + purge_amount, purge_y))}
        {% endif %}

        SAVE_GCODE_STATE NAME=LINE_PURGE_STATE
        G90
        # Establish clearance first, move XY, and only then lower to purge height.
        G0 Z{travel_z} F600
        G0 X{purge_x} Y{purge_y} F6000
        G0 Z{purge_height} F600
        M83
        G92 E0
        {% if tip_distance > 0 %}
            G1 E{tip_distance} F{purge_move_speed}
        {% endif %}
        G1 X{purge_x + purge_amount} E{purge_amount} F{purge_move_speed}
        G10
        G0 X{purge_x + purge_amount + 12.0} F3600
        G4 P400
        G0 X{purge_x + purge_amount - 8.0} F3300
        G0 X{purge_x + purge_amount + 15.0} F3300
        G0 Z{purge_height + 8.0} F600
        RESTORE_GCODE_STATE NAME=LINE_PURGE_STATE
    {% endif %}
