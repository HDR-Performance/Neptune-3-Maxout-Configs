# HDR Performance persistent speed-profile controls
# Each selection asks the standalone HDR service to back up printer.cfg, update
# only its managed XY speed limits, and restart Klipper. No Klipper source files
# are modified. Change profiles only while the printer is idle.

[gcode_macro _HDR_SPEED_PROFILE]
variable_selected: "CONFIG"
gcode:

[gcode_macro SPEED_PROFILE_NORMAL]
description: Persistent normal motion limits; backs up config and restarts Klipper
gcode:
    {% if printer.print_stats.state|lower in ['printing', 'paused'] %}
        { action_raise_error("Speed profiles may only be changed while the printer is idle.") }
    {% else %}
        RESPOND TYPE=command MSG="Applying NORMAL speed profile; Klipper will restart"
        { action_call_remote_method("hdr_set_speed_profile", profile="NORMAL") }
    {% endif %}

[gcode_macro SPEED_PROFILE_FAST]
description: Persistent fast testing limits; backs up config and restarts Klipper
gcode:
    {% if printer.print_stats.state|lower in ['printing', 'paused'] %}
        { action_raise_error("Speed profiles may only be changed while the printer is idle.") }
    {% else %}
        RESPOND TYPE=command MSG="Applying FAST speed profile; Klipper will restart"
        { action_call_remote_method("hdr_set_speed_profile", profile="FAST") }
    {% endif %}

[gcode_macro SPEED_PROFILE_LUDICROUS]
description: Maximum test limits; upgraded motors recommended; restarts Klipper
gcode:
    {% if printer.print_stats.state|lower in ['printing', 'paused'] %}
        { action_raise_error("Speed profiles may only be changed while the printer is idle.") }
    {% else %}
        RESPOND TYPE=command MSG="Applying LUDICROUS speed profile; Klipper will restart"
        { action_call_remote_method("hdr_set_speed_profile", profile="LUDICROUS") }
    {% endif %}
