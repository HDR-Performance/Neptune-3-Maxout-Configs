[gcode_macro _RECORD_PRINT_STATS]
gcode:
    {% set saved = printer.save_variables.variables %}
    {% set hours = printer.print_stats.print_duration|float / 3600.0 %}
    {% set total_hours = saved.total_print_hours|default(0)|float + hours %}
    {% set total_prints = saved.total_completed_prints|default(0)|int + 1 %}
    {% set nozzle_hours = saved.nozzle_hours|default(0)|float + hours %}
    {% set lubrication_hours = saved.lubrication_hours|default(0)|float + hours %}
    {% set belt_hours = saved.belt_check_hours|default(0)|float + hours %}
    SAVE_VARIABLE VARIABLE=total_print_hours VALUE={total_hours}
    SAVE_VARIABLE VARIABLE=total_completed_prints VALUE={total_prints}
    SAVE_VARIABLE VARIABLE=nozzle_hours VALUE={nozzle_hours}
    SAVE_VARIABLE VARIABLE=lubrication_hours VALUE={lubrication_hours}
    SAVE_VARIABLE VARIABLE=belt_check_hours VALUE={belt_hours}

[gcode_macro MAINTENANCE_STATUS]
description: Show print totals and maintenance counters
gcode:
    {% set saved = printer.save_variables.variables %}
    {% set hours = saved.total_print_hours|default(0)|float %}
    {% set prints = saved.total_completed_prints|default(0)|int %}
    {% set nozzle = saved.nozzle_hours|default(0)|float %}
    {% set lubrication = saved.lubrication_hours|default(0)|float %}
    {% set belts = saved.belt_check_hours|default(0)|float %}
    {action_respond_info("Completed prints: %d | Total print hours: %.1f" % (prints, hours))}
    {action_respond_info("Hours since service - nozzle: %.1f | lubrication: %.1f | belt check: %.1f" % (nozzle, lubrication, belts))}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin Maintenance Counters"
    RESPOND TYPE=command MSG="action:prompt_text Completed prints: {prints}"
    RESPOND TYPE=command MSG="action:prompt_text Total print hours: {'%.1f' % hours}"
    RESPOND TYPE=command MSG="action:prompt_text Nozzle service hours: {'%.1f' % nozzle}"
    RESPOND TYPE=command MSG="action:prompt_text Lubrication service hours: {'%.1f' % lubrication}"
    RESPOND TYPE=command MSG="action:prompt_text Belt check hours: {'%.1f' % belts}"
    RESPOND TYPE=command MSG="action:prompt_footer_button OK|RESPOND TYPE=command MSG=action:prompt_end|primary"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro MAINTENANCE_RESET]
description: Reset a counter. ITEM=NOZZLE, LUBRICATION, BELTS, or ALL
gcode:
    {% set item = params.ITEM|default('NOZZLE')|string|upper %}
    {% if item == 'NOZZLE' %}
        SAVE_VARIABLE VARIABLE=nozzle_hours VALUE=0.0
    {% elif item == 'LUBRICATION' %}
        SAVE_VARIABLE VARIABLE=lubrication_hours VALUE=0.0
    {% elif item == 'BELTS' %}
        SAVE_VARIABLE VARIABLE=belt_check_hours VALUE=0.0
    {% elif item == 'ALL' %}
        SAVE_VARIABLE VARIABLE=nozzle_hours VALUE=0.0
        SAVE_VARIABLE VARIABLE=lubrication_hours VALUE=0.0
        SAVE_VARIABLE VARIABLE=belt_check_hours VALUE=0.0
    {% else %}
        {action_raise_error("ITEM must be NOZZLE, LUBRICATION, BELTS, or ALL.")}
    {% endif %}
    M117 Maintenance counter reset
    {action_respond_info("Reset maintenance counter: %s." % item)}


[gcode_macro POST_OTA_VERIFY]
description: Show the required Z-offset and input-shaper checks after an OTA update
gcode:
    {% set probe_cfg = printer.configfile.settings.probe|default({}) %}
    {% set shaper_cfg = printer.configfile.settings.input_shaper|default({}) %}
    {% set z_offset = probe_cfg.z_offset|default('not saved') %}
    {% set type_x = shaper_cfg.shaper_type_x|default(shaper_cfg.shaper_type|default('not set')) %}
    {% set type_y = shaper_cfg.shaper_type_y|default(shaper_cfg.shaper_type|default('not set')) %}
    {% set freq_x = shaper_cfg.shaper_freq_x|default('not set') %}
    {% set freq_y = shaper_cfg.shaper_freq_y|default('not set') %}
    {action_respond_info("POST-OTA CHECK 1/2: Run Clean Nozzle & Set Z Offset and verify the saved Z offset before printing.")}
    {action_respond_info("Current applied probe Z offset: %s" % z_offset)}
    {action_respond_info("POST-OTA CHECK 2/2: Verify input shaper matches this printer. X=%s @ %s Hz | Y=%s @ %s Hz" % (type_x, freq_x, type_y, freq_y))}
    M117 Verify Z offset and input shaper
