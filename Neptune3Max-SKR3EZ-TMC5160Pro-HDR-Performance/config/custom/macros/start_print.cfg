[gcode_macro START_PRINT]
description: Safe KAMP start sequence for the Neptune 3 Max
gcode:
    _STOP_LED_ALERT
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    {% set SOAK_MINUTES = params.SOAK_MINUTES|default(5)|float %}
    {% set saved_soak_enabled = printer.save_variables.variables.heat_soak_enabled|default(False) %}
    {% set SOAK_ENABLED = params.SOAK|default(1 if saved_soak_enabled else 0)|int %}
    {% set STANDBY_TEMP = [EXTRUDER_TEMP, 150.0]|min %}
    {% set BED_MAX = printer.configfile.settings.heater_bed.max_temp|float - 5.0 %}
    {% set EXTRUDER_MAX = printer.configfile.settings.extruder.max_temp|float - 5.0 %}

    {% if BED_TEMP < 0 or BED_TEMP > BED_MAX %}
        {action_raise_error("BED_TEMP must be between 0 and %.0f C." % BED_MAX)}
    {% elif EXTRUDER_TEMP < 0 or EXTRUDER_TEMP > EXTRUDER_MAX %}
        {action_raise_error("EXTRUDER_TEMP must be between 0 and %.0f C." % EXTRUDER_MAX)}
    {% endif %}

    CLEAR_PAUSE
    _CLEAR_FILAMENT_STATE
    {% if params.MATERIAL is defined %}
        SET_MATERIAL MATERIAL={params.MATERIAL}
    {% else %}
        _APPLY_ACTIVE_MATERIAL
    {% endif %}
    M117 Homing
    M140 S{BED_TEMP}
    M104 S{STANDBY_TEMP}
    G28

    {% if SOAK_ENABLED == 1 and SOAK_MINUTES > 0 %}
        BED_HEAT_SOAK BED_TEMP={BED_TEMP} MINUTES={SOAK_MINUTES}
    {% else %}
        M117 Heating bed
        M190 S{BED_TEMP}
        {action_respond_info("Heat soak is off; proceeding when the bed reaches target.")}
    {% endif %}
    M109 S{STANDBY_TEMP}

    # The supplied legacy KAMP wrapper adapts BED_MESH_CALIBRATE automatically.
    M117 Adaptive mesh
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE

    # These macros establish Z clearance and cap XY travel at 100 mm/s.
    SMART_PARK
    M117 Heating nozzle
    M109 S{EXTRUDER_TEMP}

    M117 Purging
    LINE_PURGE
    G92 E0
    M117 Printing
