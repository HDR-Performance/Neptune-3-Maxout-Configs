[gcode_macro SET_MATERIAL]
description: Select a saved material profile. MATERIAL=PLA, PETG, or TPU
gcode:
    {% set material = params.MATERIAL|default('PLA')|string|upper %}
    {% set saved = printer.save_variables.variables %}
    {% if material == 'PLA' %}
        {% set pa = saved.pla_pa|default(0.056)|float %}
        {% set load_temp = saved.pla_load_temp|default(220)|float %}
    {% elif material == 'PETG' %}
        {% set pa = saved.petg_pa|default(0.056)|float %}
        {% set load_temp = saved.petg_load_temp|default(240)|float %}
    {% elif material == 'TPU' %}
        {% set pa = saved.tpu_pa|default(0.020)|float %}
        {% set load_temp = saved.tpu_load_temp|default(225)|float %}
    {% else %}
        {action_raise_error("MATERIAL must be PLA, PETG, or TPU.")}
    {% endif %}
    SET_PRESSURE_ADVANCE ADVANCE={pa}
    SAVE_VARIABLE VARIABLE=active_material VALUE='"{material}"'
    M117 Material {material}
    {action_respond_info("Material %s selected: pressure advance %.4f, load temperature %.0f C." % (material, pa, load_temp))}

[gcode_macro SAVE_MATERIAL_PROFILE]
description: Save material values. MATERIAL=PLA PA=0.056 LOAD_TEMP=220
gcode:
    {% set material = params.MATERIAL|default('PLA')|string|upper %}
    {% set pa = params.PA|default(0.056)|float %}
    {% set load_temp = params.LOAD_TEMP|default(220)|float %}
    {% if material not in ['PLA', 'PETG', 'TPU'] %}
        {action_raise_error("MATERIAL must be PLA, PETG, or TPU.")}
    {% elif pa < 0 or pa > 0.3 %}
        {action_raise_error("PA must be between 0 and 0.3.")}
    {% elif load_temp < 170 or load_temp > 290 %}
        {action_raise_error("LOAD_TEMP must be between 170 and 290 C.")}
    {% else %}
        SAVE_VARIABLE VARIABLE={material|lower}_pa VALUE={pa}
        SAVE_VARIABLE VARIABLE={material|lower}_load_temp VALUE={load_temp}
        SET_PRESSURE_ADVANCE ADVANCE={pa}
        SAVE_VARIABLE VARIABLE=active_material VALUE='"{material}"'
        M117 Saved {material} profile
        {action_respond_info("Saved %s: pressure advance %.4f, load temperature %.0f C." % (material, pa, load_temp))}
    {% endif %}

[gcode_macro _APPLY_ACTIVE_MATERIAL]
gcode:
    {% set saved = printer.save_variables.variables %}
    {% set material = saved.active_material|default('PLA')|string|upper %}
    {% if material == 'PETG' %}
        {% set pa = saved.petg_pa|default(0.056)|float %}
    {% elif material == 'TPU' %}
        {% set pa = saved.tpu_pa|default(0.020)|float %}
    {% else %}
        {% set material = 'PLA' %}
        {% set pa = saved.pla_pa|default(0.056)|float %}
    {% endif %}
    SET_PRESSURE_ADVANCE ADVANCE={pa}
    {action_respond_info("Active material: %s; pressure advance %.4f." % (material, pa))}

