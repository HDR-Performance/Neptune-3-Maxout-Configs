[gcode_macro TOGGLE_HEAT_SOAK]
description: Toggle automatic pre-KAMP bed heat soak on or off
gcode:
    {% set saved = printer.save_variables.variables %}
    {% set currently_enabled = saved.heat_soak_enabled|default(False) %}
    {% if currently_enabled %}
        SAVE_VARIABLE VARIABLE=heat_soak_enabled VALUE=False
        M117 Heat soak OFF
        {action_respond_info("Automatic pre-KAMP bed heat soak is OFF.")}
    {% else %}
        SAVE_VARIABLE VARIABLE=heat_soak_enabled VALUE=True
        M117 Heat soak ON
        {action_respond_info("Automatic pre-KAMP bed heat soak is ON.")}
    {% endif %}

[gcode_macro HEAT_SOAK_STATUS]
description: Show whether automatic pre-KAMP heat soak is enabled
gcode:
    {% set enabled = printer.save_variables.variables.heat_soak_enabled|default(False) %}
    {% if enabled %}
        M117 Heat soak ON
        {action_respond_info("Automatic pre-KAMP bed heat soak is ON.")}
    {% else %}
        M117 Heat soak OFF
        {action_respond_info("Automatic pre-KAMP bed heat soak is OFF.")}
    {% endif %}

[gcode_macro BED_HEAT_SOAK]
description: Heat and stabilize the bed. BED_TEMP=60 MINUTES=5
gcode:
    {% set bed_temp = params.BED_TEMP|default(60)|float %}
    {% set minutes = params.MINUTES|default(5)|float %}
    {% if bed_temp < 0 or bed_temp > 110 %}
        {action_raise_error("BED_TEMP must be between 0 and 110 C.")}
    {% elif minutes < 0 or minutes > 30 %}
        {action_raise_error("MINUTES must be between 0 and 30.")}
    {% else %}
        M140 S{bed_temp}
        {% if bed_temp > 0 %}
            M117 Heating bed to {bed_temp} C
            M190 S{bed_temp}
        {% endif %}
        {% if minutes > 0 %}
            M117 Bed soaking for {minutes} min
            {action_respond_info("Bed reached %.0f C. Stabilizing for %.1f minutes." % (bed_temp, minutes))}
            G4 P{minutes * 60000}
        {% endif %}
        M117 Bed ready
    {% endif %}
