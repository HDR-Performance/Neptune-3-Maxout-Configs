[gcode_macro _FILAMENT_STATE]
variable_active: False
variable_saved_temp: 0.0
gcode:

[gcode_macro _CLEAR_FILAMENT_STATE]
gcode:
    UPDATE_DELAYED_GCODE ID=_RUNOUT_COOLDOWN DURATION=0
    SET_GCODE_VARIABLE MACRO=_FILAMENT_STATE VARIABLE=active VALUE=False
    SET_GCODE_VARIABLE MACRO=_FILAMENT_STATE VARIABLE=saved_temp VALUE=0.0

[gcode_macro _UNLOAD_FILAMENT_CORE]
gcode:
    {% set distance = params.DISTANCE|default(70)|float %}
    SAVE_GCODE_STATE NAME=UNLOAD_FILAMENT_STATE
    M83
    G92 E0
    G1 E5 F180
    G1 E-15 F1200
    G1 E-{distance} F1800
    RESTORE_GCODE_STATE NAME=UNLOAD_FILAMENT_STATE

[gcode_macro LOAD_FILAMENT]
description: Heat and load filament. TEMP uses active material; LOAD=70 PURGE=10
gcode:
    {% set saved = printer.save_variables.variables %}
    {% set material = saved.active_material|default('PLA')|string|upper %}
    {% if material == 'PETG' %}
        {% set default_temp = saved.petg_load_temp|default(240)|float %}
    {% elif material == 'TPU' %}
        {% set default_temp = saved.tpu_load_temp|default(225)|float %}
    {% else %}
        {% set default_temp = saved.pla_load_temp|default(220)|float %}
    {% endif %}
    {% set temp = params.TEMP|default(default_temp)|float %}
    {% set load = params.LOAD|default(70)|float %}
    {% set purge = params.PURGE|default(10)|float %}
    {% set keep_hot = params.KEEP_HOT|default(0)|int %}
    {% if printer.print_stats.state == 'printing' %}
        {action_raise_error("Pause the print before loading filament.")}
    {% elif temp < 170 or temp > 290 %}
        {action_raise_error("TEMP must be between 170 and 290 C.")}
    {% elif load < 0 or load > 90 or purge < 0 or purge > 30 %}
        {action_raise_error("LOAD must be 0-90 mm and PURGE must be 0-30 mm.")}
    {% else %}
        M109 S{temp}
        SAVE_GCODE_STATE NAME=LOAD_FILAMENT_STATE
        M83
        G92 E0
        {% if load > 0 %}
            G1 E{load} F600
        {% endif %}
        {% if purge > 0 %}
            G1 E{purge} F120
        {% endif %}
        G1 E-0.5 F1200
        RESTORE_GCODE_STATE NAME=LOAD_FILAMENT_STATE
        {% if keep_hot == 0 %}
            M104 S0
        {% endif %}
        M117 Filament loaded
    {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Heat and unload filament. TEMP uses active material; UNLOAD=70
gcode:
    {% set saved = printer.save_variables.variables %}
    {% set material = saved.active_material|default('PLA')|string|upper %}
    {% if material == 'PETG' %}
        {% set default_temp = saved.petg_load_temp|default(240)|float %}
    {% elif material == 'TPU' %}
        {% set default_temp = saved.tpu_load_temp|default(225)|float %}
    {% else %}
        {% set default_temp = saved.pla_load_temp|default(220)|float %}
    {% endif %}
    {% set temp = params.TEMP|default(default_temp)|float %}
    {% set unload = params.UNLOAD|default(70)|float %}
    {% set keep_hot = params.KEEP_HOT|default(0)|int %}
    {% if printer.print_stats.state == 'printing' %}
        {action_raise_error("Pause the print before unloading filament.")}
    {% elif temp < 170 or temp > 290 %}
        {action_raise_error("TEMP must be between 170 and 290 C.")}
    {% elif unload < 10 or unload > 90 %}
        {action_raise_error("UNLOAD must be between 10 and 90 mm.")}
    {% else %}
        M109 S{temp}
        _UNLOAD_FILAMENT_CORE DISTANCE={unload}
        {% if keep_hot == 0 %}
            M104 S0
        {% endif %}
        M117 Filament unloaded
    {% endif %}

[gcode_macro _COLOR_CHANGE]
gcode:
    {% if printer.print_stats.state != 'printing' %}
        {action_raise_error("M600 may only be used during a print.")}
    {% else %}
        {% set target = printer.extruder.target|float %}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_STATE VARIABLE=saved_temp VALUE={target}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_STATE VARIABLE=active VALUE=True
        PAUSE
        M109 S{target}
        _UNLOAD_FILAMENT_CORE DISTANCE=70
        UPDATE_DELAYED_GCODE ID=_RUNOUT_COOLDOWN DURATION=600
        M117 Insert filament, then RUNOUT RESUME
    {% endif %}

[gcode_macro M600]
description: Pause, park, and unload filament for a color change
gcode:
    _COLOR_CHANGE

[gcode_macro _FILAMENT_RUNOUT]
gcode:
    {% if printer.print_stats.state == 'printing' %}
        {% set target = printer.extruder.target|float %}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_STATE VARIABLE=saved_temp VALUE={target}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_STATE VARIABLE=active VALUE=True
        PAUSE
        UPDATE_DELAYED_GCODE ID=_RUNOUT_COOLDOWN DURATION=600
        M117 Filament runout - insert filament
        {action_respond_info("Filament runout detected. Insert filament and press RUNOUT_RESUME.")}
    {% endif %}

[gcode_macro _FILAMENT_INSERTED]
gcode:
    {% if printer['gcode_macro _FILAMENT_STATE'].active %}
        {% set target = printer['gcode_macro _FILAMENT_STATE'].saved_temp|float %}
        M104 S{target}
        # Start a fresh safety window in case filament is inserted but the
        # operator does not press RUNOUT_RESUME.
        UPDATE_DELAYED_GCODE ID=_RUNOUT_COOLDOWN DURATION=600
        M117 Filament detected - press RUNOUT RESUME
    {% endif %}

[delayed_gcode _RUNOUT_COOLDOWN]
gcode:
    {% if printer['gcode_macro _FILAMENT_STATE'].active and printer.pause_resume.is_paused %}
        M104 S0
        M117 Paused hotend cooled for safety
        {action_respond_info("Runout pause exceeded 10 minutes; hotend heater switched off.")}
    {% endif %}

[gcode_macro RUNOUT_RESUME]
description: Reheat, load, purge, and resume after runout or color change
gcode:
    {% set state = printer['gcode_macro _FILAMENT_STATE'] %}
    {% set detected = printer['filament_switch_sensor filament_sensor'].filament_detected %}
    {% if not state.active %}
        {action_raise_error("No filament runout or color change is active.")}
    {% elif not detected %}
        {action_raise_error("Filament sensor does not detect filament.")}
    {% else %}
        {% set target = state.saved_temp|float %}
        UPDATE_DELAYED_GCODE ID=_RUNOUT_COOLDOWN DURATION=0
        M109 S{target}
        SAVE_GCODE_STATE NAME=RUNOUT_LOAD_STATE
        M83
        G92 E0
        G1 E70 F600
        G1 E10 F120
        G1 E-0.5 F1200
        RESTORE_GCODE_STATE NAME=RUNOUT_LOAD_STATE
        SET_GCODE_VARIABLE MACRO=_FILAMENT_STATE VARIABLE=active VALUE=False
        SET_GCODE_VARIABLE MACRO=_FILAMENT_STATE VARIABLE=saved_temp VALUE=0.0
        RESUME
    {% endif %}
