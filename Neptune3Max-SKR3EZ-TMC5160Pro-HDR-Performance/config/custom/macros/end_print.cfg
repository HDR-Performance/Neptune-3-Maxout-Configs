[gcode_macro END_PRINT]
description: End the print with a bounded Z lift and safe park
gcode:
    _RECORD_PRINT_STATS
    _CLEAR_FILAMENT_STATE
    TURN_OFF_HEATERS
    M107
    SET_GCODE_VARIABLE MACRO=SET_FAN_SPEED VARIABLE=fan_override VALUE="False"
    {% if "xyz" in printer.toolhead.homed_axes %}
        {% set max_z = printer.toolhead.axis_maximum.z|float %}
        {% set act_z = printer.toolhead.position.z|float %}
        {% set z_lift = [10.0, max_z - act_z]|min %}
        G91
        {% if z_lift > 0 %}
            G0 Z{z_lift} F600
        {% endif %}
        G90
        G0 Y200 F3000
    {% endif %}
    BED_MESH_CLEAR
    M84
