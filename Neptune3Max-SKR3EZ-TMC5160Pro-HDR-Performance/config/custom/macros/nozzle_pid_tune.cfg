[gcode_macro NOZZLE_PID_TUNE]
description: Tune the hotend PID. Usage: NOZZLE_PID_TUNE TEMP=230 FAN_SPEED=0
gcode:
  {% set TEMP = params.TEMP|default(230)|float %}
  {% set FAN_SPEED = params.FAN_SPEED|default(0)|float %}
  {% set MAX_TEMP = printer.configfile.settings.extruder.max_temp|float - 5.0 %}
  {% if TEMP >= 170 and TEMP <= MAX_TEMP %}
    {% if FAN_SPEED >= 0 and FAN_SPEED <= 100 %}
      M117 Nozzle PID at {TEMP} C
      M106 S{(FAN_SPEED * 2.55)|int}
      PID_CALIBRATE HEATER=extruder TARGET={TEMP}
      M107
      SAVE_CONFIG
    {% else %}
      {action_raise_error("FAN_SPEED must be between 0 and 100.")}
    {% endif %}
  {% else %}
    {action_raise_error("TEMP must be between 170 and %.0f C." % MAX_TEMP)}
  {% endif %}
