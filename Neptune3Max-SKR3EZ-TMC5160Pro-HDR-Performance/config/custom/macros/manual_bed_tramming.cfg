[gcode_macro MANUAL_BED_TRAMMING]
description: Home and probe all saved manual bed-adjuster locations
gcode:
    {% if printer.print_stats.state|lower in ["printing", "paused"] %}
        {action_raise_error("Bed tramming is unavailable while printing or paused")}
    {% endif %}
    {% if "screws_tilt_adjust" not in printer.configfile.config %}
        {action_raise_error("Run BED_SCREW_LOCATION and save every physical adjuster first")}
    {% endif %}
    G28
    SCREWS_TILT_CALCULATE
    G90
    G1 X{(printer.toolhead.axis_minimum.x + printer.toolhead.axis_maximum.x) / 2.0} Y{(printer.toolhead.axis_minimum.y + printer.toolhead.axis_maximum.y) / 2.0} Z25 F3000
