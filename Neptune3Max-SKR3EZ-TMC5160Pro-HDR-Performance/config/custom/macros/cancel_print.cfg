[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
description: Cancel immediately, lift safely, and present the build plate
gcode:
    M117 Cancelling print

    # Release virtual-SD and pause state first so the UI cannot remain trapped
    # in a printing/cancelling state if a later park command cannot complete.
    CANCEL_PRINT_BASE
    TURN_OFF_HEATERS
    M107

    {% set x_park = (printer.toolhead.axis_minimum.x|float + printer.toolhead.axis_maximum.x|float) / 2.0 %}
    {% set y_present = printer.toolhead.axis_maximum.y|float - 10.0 %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set z_safe = [10.0, max_z - act_z]|min %}

    {% if "xyz" in printer.toolhead.homed_axes %}
        G91
        {% if z_safe > 0 %}
            G1 Z{z_safe} F600
        {% endif %}
        G90
        G1 X{x_park} Y{y_present} F3600
    {% endif %}

    SET_GCODE_VARIABLE MACRO=SET_FAN_SPEED VARIABLE=fan_override VALUE=False
    _CLEAR_FILAMENT_STATE
    BED_MESH_CLEAR
    CLEAR_PAUSE
    M84
    M117 Print cancelled
