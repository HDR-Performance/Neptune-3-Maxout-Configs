# HDR Performance Maxout configuration for Elegoo Neptune 3 Max
# BIGTREETECH SKR 3 EZ + TMC5160 Pro EZ + BTT Pad 7
#
# Geometry and working current values are based on the supplied HDR Performance
# Neptune 3 Max configuration. Board pins follow BIGTREETECH's official SKR 3
# EZ pinout. Inspect the MCU package before compiling: SKR 3 boards may contain
# either an STM32H723 or STM32H743.
# Firmware: selected H723/H743, 128KiB bootloader, 25MHz crystal, USB PA11/PA12.
# Flash: Rename klipper.bin to firmware.bin, copy to SD card root, power on to update.
# See docs/Config_Reference.md for a description of parameters.

[mcu]
serial: /dev/serial/by-id/REPLACE_WITH_YOUR_SKR3_EZ_ID
restart_method: command

# Uncomment these only when they already exist on the Pad 7.
#[include mainsail.cfg]
#[include timelapse.cfg]
[include KAMP_Settings.cfg]
[include custom/macros/persistent_state.cfg]
[include custom/macros/material_profiles.cfg]
[include custom/macros/filament_control.cfg]
[include custom/macros/bed_heat_soak.cfg]
[include custom/macros/maintenance.cfg]
[include custom/macros/z_offset_calibration.cfg]
[exclude_object]

[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]

[display_status]

[gcode_macro START_PRINT]
description: Safe KAMP start sequence for the Neptune 3 Max
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    {% set SOAK_MINUTES = params.SOAK_MINUTES|default(5)|float %}
    {% set saved_soak_enabled = printer.save_variables.variables.heat_soak_enabled|default(False) %}
    {% set SOAK_ENABLED = params.SOAK|default(1 if saved_soak_enabled else 0)|int %}
    {% set STANDBY_TEMP = [EXTRUDER_TEMP, 150.0]|min %}
    {% set BED_MAX = printer.configfile.settings.heater_bed.max_temp|float - 5.0 %}
    {% set EXTRUDER_MAX = printer.configfile.settings.extruder.max_temp|float - 5.0 %}

    {% if BED_TEMP < 0 or BED_TEMP > BED_MAX %}
        {action_raise_error("BED_TEMP must be between 0 and %.0f C." % BED_MAX)}
    {% elif EXTRUDER_TEMP < 0 or EXTRUDER_TEMP > EXTRUDER_MAX %}
        {action_raise_error("EXTRUDER_TEMP must be between 0 and %.0f C." % EXTRUDER_MAX)}
    {% endif %}

    CLEAR_PAUSE
    _CLEAR_FILAMENT_STATE
    {% if params.MATERIAL is defined %}
        SET_MATERIAL MATERIAL={params.MATERIAL}
    {% else %}
        _APPLY_ACTIVE_MATERIAL
    {% endif %}
    M117 Homing
    M140 S{BED_TEMP}
    M104 S{STANDBY_TEMP}
    G28

    {% if SOAK_ENABLED == 1 and SOAK_MINUTES > 0 %}
        BED_HEAT_SOAK BED_TEMP={BED_TEMP} MINUTES={SOAK_MINUTES}
    {% else %}
        M117 Heating bed
        M190 S{BED_TEMP}
        {action_respond_info("Heat soak is off; proceeding when the bed reaches target.")}
    {% endif %}
    M109 S{STANDBY_TEMP}

    # The supplied legacy KAMP wrapper adapts BED_MESH_CALIBRATE automatically.
    M117 Adaptive mesh
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE

    # These macros establish Z clearance and cap XY travel at 100 mm/s.
    SMART_PARK
    M117 Heating nozzle
    M109 S{EXTRUDER_TEMP}

    M117 Purging
    LINE_PURGE
    G92 E0
    M117 Printing

[gcode_macro CANCEL_PRINT]
description: Cancels the print safely
rename_existing: CANCEL_PRINT_BASE
gcode:
    M117 Cancelling print

    # Park like PAUSE
    {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
    {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < (max_z - 2.0) %}
        {% set z_safe = 2.0 %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}

    G91
    {% if "xyz" in printer.toolhead.homed_axes %}
        G1 Z{z_safe} F900
        G90
        G1 X{x_park} Y{y_park} F6000
    {% endif %}

    # Shut down
    TURN_OFF_HEATERS
    M107
    SET_GCODE_VARIABLE MACRO=SET_FAN_SPEED VARIABLE=fan_override VALUE=False
    _CLEAR_FILAMENT_STATE
    BED_MESH_CLEAR
    CLEAR_PAUSE

    # ONLY reset SD if printing from SD
    {% if printer.virtual_sdcard.is_active %}
        SDCARD_RESET_FILE
    {% endif %}

    M84
    M117 Print cancelled

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
# change this if you need more or less extrusion
variable_extrude: 1.0
gcode:
    ##### read E from pause macro #####
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    ##### set park positon for x and y #####
    # default is your max posion from your printer.cfg
    {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
    {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
    ##### calculate save lift position #####
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < (max_z - 2.0) %}
        {% set z_safe = 2.0 %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}
    ##### end of definitions #####
    PAUSE_BASE
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E-{E} F2100
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}
    {% if "xyz" in printer.toolhead.homed_axes %}
      G1 Z{z_safe} F900
      G90
      G1 X{x_park} Y{y_park} F6000
    {% else %}
      {action_respond_info("Printer not homed")}
    {% endif %}

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
    {% if printer['gcode_macro _FILAMENT_STATE'].active %}
      {action_raise_error("Use RUNOUT_RESUME after inserting filament.")}
    {% endif %}
    ##### read E from pause macro #####
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    #### get VELOCITY parameter if specified ####
    {% if 'VELOCITY' in params|upper %}
      {% set get_params = ('VELOCITY=' + params.VELOCITY) %}
    {%else %}
      {% set get_params = "" %}
    {% endif %}
    ##### end of definitions #####
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G91
      G1 E{E} F2100
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}
    RESUME_BASE {get_params}

[gcode_macro END_PRINT]
description: End the print with a bounded Z lift and safe park
gcode:
    _RECORD_PRINT_STATS
    _CLEAR_FILAMENT_STATE
    TURN_OFF_HEATERS
    M107
    SET_GCODE_VARIABLE MACRO=SET_FAN_SPEED VARIABLE=fan_override VALUE="False"
    {% if "xyz" in printer.toolhead.homed_axes %}
        {% set max_z = printer.toolhead.axis_maximum.z|float %}
        {% set act_z = printer.toolhead.position.z|float %}
        {% set z_lift = [10.0, max_z - act_z]|min %}
        G91
        {% if z_lift > 0 %}
            G0 Z{z_lift} F600
        {% endif %}
        G90
        G0 Y200 F3000
    {% endif %}
    BED_MESH_CLEAR
    M84

[homing_override]
gcode:
  G28 X Y ; Home X and Y axes to endstops
  G90 ; Absolute positioning
  G0 X241 Y193 F6000 ; Move to safe Z homing position at 100 mm/s
  G28 Z ; Home Z axis with probe
  G91 ; Relative positioning
  G0 Z10 F900 ; Z-hop 10 mm after homing (matches safe_z_home z_hop: 10)
  G90 ; Back to absolute positioning
set_position_z: 0 ; Reset Z position to 0 after homing

[gcode_macro MANUAL_BED_TRAMMING]
description: Home and measure for manual leveling adjustments
gcode:
  G28
  SCREWS_TILT_CALCULATE
  G90
  G1 F3000 X213 Y213 Z25

[gcode_macro CALIBRATE_SHAPER]
description: Calibrate and save input shaper values for both axes
gcode:
    G28
    SHAPER_CALIBRATE
    SAVE_CONFIG

[gcode_macro HDR_PACKAGE_INFO]
description: Display upgrade-package credit and target printer
gcode:
    M117 HDR Performance - Neptune 3 Max
    {action_respond_info("HDR Performance Neptune 3 Max SKR 3 EZ Maxout package.")}

[led LED_Light]
white_pin: PB7
initial_white: 1.0

[printer]
kinematics: cartesian
max_velocity: 800
max_accel: 5000
#minimum_cruise_ratio: 0.5
max_z_velocity: 25
max_z_accel: 200
square_corner_velocity: 5
# Use those higher values just to configure Input Shaper
#max_accel: 10000
#max_accel_to_decel: 10000

[stepper_x]
step_pin: PD4
dir_pin: !PD3
enable_pin: !PD6
microsteps: 16 # Set via driver jumpers/SPI
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_min: 0
position_max: 430
homing_speed: 70

[stepper_y]
step_pin: PA15
dir_pin: !PA8
enable_pin: !PD1
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC3
position_endstop: -6
position_min: -6
position_max: 430
homing_speed: 40

[stepper_z]
step_pin: PE2
dir_pin: PE3
enable_pin: !PE0
rotation_distance: 8.0
microsteps: 16
position_min: -4.0
position_max: 506
endstop_pin: probe:z_virtual_endstop
homing_speed: 10
homing_retract_speed: 15

[extruder]
max_extrude_only_distance: 100.0
max_extrude_cross_section: 10
step_pin: PD15
dir_pin: !PD14
enable_pin: !PC7
microsteps: 16
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB3  # Adapted from stock PA6
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA2  # Adapted from stock PC1
min_temp: 0
max_temp: 305
rotation_distance: 6.9
control: pid
pid_kp: 32.771
pid_ki: 3.361
pid_kd: 79.880  # Safe starting values from the supplied working FlowTech build; retune

[verify_heater extruder]
hysteresis: 5
max_error: 120
check_gain_time: 25

[firmware_retraction]
retract_length: 0.5
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 35

[heater_bed]
heater_pin: PD7  # Adapted from stock PA5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA1  # Adapted from stock PC0
pwm_cycle_time: 0.020
max_temp: 110
min_temp: 0
control: pid
pid_kp: 71.562
pid_ki: 0.778
pid_kd: 1645.031

[heater_fan hotend_fan]
pin: PB5  # Adapted from stock PB0
heater: extruder
heater_temp: 50.0

[fan]
pin: PB6  # Adapted from stock PA7

[gcode_macro SET_FAN_SPEED]
description: Sets a manual fan speed with optional override persistence
variable_fan_speed: 0
variable_fan_override: False
gcode:
    {% set SPEED = params.SPEED|default(100)|float %}
    {% set OVERRIDE = params.OVERRIDE|default(0)|int %}
    {% if SPEED >= 0 and SPEED <= 100 %}
        {% set FAN_SPEED = ((SPEED / 100.0) * 255)|int %}
        M106 S{FAN_SPEED}
        G4 P100
        SET_GCODE_VARIABLE MACRO=SET_FAN_SPEED VARIABLE=fan_speed VALUE={FAN_SPEED}
        SET_GCODE_VARIABLE MACRO=SET_FAN_SPEED VARIABLE=fan_override VALUE={OVERRIDE > 0}
        M117 Fan speed set to {SPEED}% {", override " + ("enabled" if OVERRIDE > 0 else "disabled")}
    {% else %}
        {action_raise_error("SPEED must be between 0 and 100.")}
    {% endif %}

[gcode_macro UPDATE_FAN_SPEED]
description: Internal macro to enforce fan speed override during print
gcode:
    {% if printer['gcode_macro SET_FAN_SPEED'].fan_override %}
        M106 S{printer['gcode_macro SET_FAN_SPEED'].fan_speed}
    {% endif %}

[force_move]
enable_force_move: True

[probe]
pin: ^PC0  # Connected through Z-STOP/PC0 in the supplied working build
speed: 8
lift_speed: 40
samples: 5
samples_result: median
samples_tolerance: 0.040
samples_tolerance_retries: 8
x_offset: -28.5
y_offset: 22
z_offset: 0.0  # commissioning placeholder; calibrate before printing

[filament_switch_sensor filament_sensor]
pause_on_runout: false
switch_pin: ^PC2
runout_gcode:
    _FILAMENT_RUNOUT
insert_gcode:
    _FILAMENT_INSERTED
event_delay: 3.0

[bed_mesh]
probe_count: 11,9
algorithm: bicubic
speed: 150
horizontal_move_z: 10
mesh_min: 33, 16
mesh_max: 397, 397
fade_start: 1.0
fade_end: 10.0

[temperature_sensor raspberry_pi]
sensor_type: temperature_host

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
#sensor_temperature1: 25
#sensor_adc1: 0.210317

[gcode_macro M420]
description: Load the current mesh
gcode:
  BED_MESH_PROFILE LOAD=default
 
[gcode_macro G29]
description: Home and create a runtime adaptive bed mesh
gcode:
  G28
  BED_MESH_CLEAR
  BED_MESH_CALIBRATE

[screws_tilt_adjust]
screw_thread: CW-M3
speed: 200
screw1: 243.5, 193
screw1_name: center
screw2: 421, 370.5
screw2_name: right back screw
screw3: 421, 193
screw3_name: right middle screw
screw4: 421, 15.5
screw4_name: right front screw
screw5: 66, 15.5
screw5_name: left front screw
screw6: 66, 193
screw6_name: left middle screw
screw7: 66, 370.5
screw7_name: left back screw

[mcu CB1]  # Keep if using CB1/RPi for host
serial: /tmp/klipper_host_mcu

[adxl345]
cs_pin: CB1:None
spi_bus: spidev1.1
spi_speed: 5000000
axes_map: z,y,-x

[resonance_tester]
accel_chip: adxl345
probe_points:
    215, 215, 20
accel_per_hz: 50
max_smoothing: 0.2

[input_shaper]
# Known-good HDR Maxout baseline from the upgraded X/Y motor, SKR 3 EZ,
# and TMC5160 Pro machine. Re-run CALIBRATE_SHAPER after mechanical changes.
shaper_type_x: ei
shaper_freq_x: 50.0
shaper_type_y: ei
shaper_freq_y: 40.2

[gcode_macro BED_PID_TUNE]
description: Tune the bed PID. Usage: BED_PID_TUNE TEMP=60
gcode:
  {% set TEMP = params.TEMP|default(60)|float %}
  {% set MAX_TEMP = printer.configfile.settings.heater_bed.max_temp|float - 5.0 %}
  {% if TEMP >= 0 and TEMP <= MAX_TEMP %}
    M117 Bed PID at {TEMP} C
    PID_CALIBRATE HEATER=heater_bed TARGET={TEMP}
    SAVE_CONFIG
  {% else %}
    {action_raise_error("TEMP must be between 0 and %.0f C." % MAX_TEMP)}
  {% endif %}

[gcode_macro NOZZLE_PID_TUNE]
description: Tune the hotend PID. Usage: NOZZLE_PID_TUNE TEMP=230 FAN_SPEED=0
gcode:
  {% set TEMP = params.TEMP|default(230)|float %}
  {% set FAN_SPEED = params.FAN_SPEED|default(0)|float %}
  {% set MAX_TEMP = printer.configfile.settings.extruder.max_temp|float - 5.0 %}
  {% if TEMP >= 170 and TEMP <= MAX_TEMP %}
    {% if FAN_SPEED >= 0 and FAN_SPEED <= 100 %}
      M117 Nozzle PID at {TEMP} C
      M106 S{(FAN_SPEED * 2.55)|int}
      PID_CALIBRATE HEATER=extruder TARGET={TEMP}
      M107
      SAVE_CONFIG
    {% else %}
      {action_raise_error("FAN_SPEED must be between 0 and 100.")}
    {% endif %}
  {% else %}
    {action_raise_error("TEMP must be between 170 and %.0f C." % MAX_TEMP)}
  {% endif %}

[gcode_arcs]
resolution: 0.5

########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PC5, EXP1_3=PB1, EXP1_5=PE9,  EXP1_7=PE11, EXP1_9=<GND>,
    EXP1_2=PB0, EXP1_4=PE8, EXP1_6=PE10, EXP1_8=PE12, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=PA6, EXP2_3=PE7, EXP2_5=PB2, EXP2_7=PC4,   EXP2_9=<GND>,
    EXP2_2=PA5, EXP2_4=PA4, EXP2_6=PA7, EXP2_8=<RST>, EXP2_10=<NC>

# See the sample-lcd.cfg file for definitions of common LCD displays.

########################################
# TMC5160 configuration (SPI mode)
########################################

[tmc5160 stepper_x]
cs_pin: PD5
spi_software_miso_pin: PE15
spi_software_mosi_pin: PE13
spi_software_sclk_pin: PE14
run_current: 1.0
hold_current: 0.5
sense_resistor: 0.075
interpolate: true
stealthchop_threshold: 999999

[tmc5160 stepper_y]
cs_pin: PD0
spi_software_miso_pin: PE15
spi_software_mosi_pin: PE13
spi_software_sclk_pin: PE14
run_current: 1.6
hold_current: 0.7
sense_resistor: 0.075
interpolate: true
stealthchop_threshold: 999999

[tmc5160 stepper_z]
cs_pin: PE1
spi_software_miso_pin: PE15
spi_software_mosi_pin: PE13
spi_software_sclk_pin: PE14
run_current: 0.8
hold_current: 0.5
sense_resistor: 0.075
interpolate: true
stealthchop_threshold: 999999

[tmc5160 extruder]
cs_pin: PC6
spi_software_miso_pin: PE15
spi_software_mosi_pin: PE13
spi_software_sclk_pin: PE14
run_current: 0.8
hold_current: 0.4
sense_resistor: 0.075
interpolate: true
stealthchop_threshold: 999999

