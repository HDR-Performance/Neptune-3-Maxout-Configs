# HDR Performance Maxout configuration for Elegoo Neptune 3 Max
# BIGTREETECH SKR 3 EZ + TMC5160 Pro EZ + BTT Pad 7
#
# Geometry and working current values are based on the supplied HDR Performance
# Neptune 3 Max configuration. Board pins follow BIGTREETECH's official SKR 3
# EZ pinout. Inspect the MCU package before compiling: SKR 3 boards may contain
# either an STM32H723 or STM32H743.
# Firmware: selected H723/H743, 128KiB bootloader, 25MHz crystal, USB PA11/PA12.
# Flash: Rename klipper.bin to firmware.bin, copy to SD card root, power on to update.
# See docs/Config_Reference.md for a description of parameters.

[mcu]
serial: /dev/serial/by-id/REPLACE_WITH_YOUR_SKR3_EZ_ID
restart_method: command

# Uncomment these only when they already exist on the Pad 7.
#[include mainsail.cfg]
#[include timelapse.cfg]
[include KAMP_Settings.cfg]
[include custom/macros/persistent_state.cfg]
[include custom/macros/material_profiles.cfg]
[include custom/macros/filament_control.cfg]
[include custom/macros/bed_heat_soak.cfg]
[include custom/macros/maintenance.cfg]
[include custom/macros/z_offset_calibration.cfg]
[include custom/generated/screws_tilt_adjust.cfg]
[include custom/macros/bed_screw_location.cfg]
[include custom/macros/start_print.cfg]
[include custom/macros/cancel_print.cfg]
[include custom/macros/pause.cfg]
[include custom/macros/resume.cfg]
[include custom/macros/end_print.cfg]
[include custom/macros/manual_bed_tramming.cfg]
[include custom/macros/calibrate_shaper.cfg]
[include custom/macros/hdr_package_info.cfg]
[include custom/macros/set_fan_speed.cfg]
[include custom/macros/update_fan_speed.cfg]
[include custom/macros/m420.cfg]
[include custom/macros/g29.cfg]
[include custom/macros/bed_pid_tune.cfg]
[include custom/macros/nozzle_pid_tune.cfg]

[exclude_object]

[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]

[display_status]

[homing_override]
gcode:
  G28 X Y ; Home X and Y axes to endstops
  G90 ; Absolute positioning
  G0 X241 Y193 F6000 ; Move to safe Z homing position at 100 mm/s
  G28 Z ; Home Z axis with probe
  G91 ; Relative positioning
  G0 Z10 F900 ; Z-hop 10 mm after homing (matches safe_z_home z_hop: 10)
  G90 ; Back to absolute positioning
set_position_z: 0 ; Reset Z position to 0 after homing

[led LED_Light]
white_pin: PB7
initial_white: 1.0

[printer]
kinematics: cartesian
# HDR_SPEED_LIMITS_BEGIN
max_velocity: 800
max_accel: 5000
#minimum_cruise_ratio: 0.5
max_z_velocity: 25
max_z_accel: 200
square_corner_velocity: 5
# HDR_SPEED_LIMITS_END
# Use those higher values just to configure Input Shaper
#max_accel: 10000
#max_accel_to_decel: 10000

[stepper_x]
step_pin: PD4
dir_pin: !PD3
enable_pin: !PD6
microsteps: 16 # Set via driver jumpers/SPI
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_min: 0
position_max: 430
homing_speed: 70

[stepper_y]
step_pin: PA15
dir_pin: !PA8
enable_pin: !PD1
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC3
position_endstop: -6
position_min: -6
position_max: 430
homing_speed: 40

[stepper_z]
step_pin: PE2
dir_pin: PE3
enable_pin: !PE0
rotation_distance: 8.0
microsteps: 16
position_min: -4.0
position_max: 506
endstop_pin: probe:z_virtual_endstop
homing_speed: 10
homing_retract_speed: 15

[extruder]
max_extrude_only_distance: 100.0
max_extrude_cross_section: 10
step_pin: PD15
dir_pin: !PD14
enable_pin: !PC7
microsteps: 16
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB3  # Adapted from stock PA6
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA2  # Adapted from stock PC1
min_temp: 0
max_temp: 305
rotation_distance: 6.9
control: pid
pid_kp: 32.771
pid_ki: 3.361
pid_kd: 79.880  # Safe starting values from the supplied working FlowTech build; retune

[verify_heater extruder]
hysteresis: 5
max_error: 120
check_gain_time: 25

[firmware_retraction]
retract_length: 0.5
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 35

[heater_bed]
heater_pin: PD7  # Adapted from stock PA5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA1  # Adapted from stock PC0
pwm_cycle_time: 0.020
max_temp: 110
min_temp: 0
control: pid
pid_kp: 71.562
pid_ki: 0.778
pid_kd: 1645.031

[heater_fan hotend_fan]
pin: PB5  # Adapted from stock PB0
heater: extruder
heater_temp: 50.0

[fan]
pin: PB6  # Adapted from stock PA7

[force_move]
enable_force_move: True

[probe]
pin: ^PC0  # Connected through Z-STOP/PC0 in the supplied working build
speed: 8
lift_speed: 40
samples: 5
samples_result: median
samples_tolerance: 0.040
samples_tolerance_retries: 8
x_offset: -28.5
y_offset: 22
z_offset: 0.0  # commissioning placeholder; calibrate before printing

[filament_switch_sensor filament_sensor]
pause_on_runout: false
switch_pin: ^PC2
runout_gcode:
    _FILAMENT_RUNOUT
insert_gcode:
    _FILAMENT_INSERTED
event_delay: 3.0

[bed_mesh]
probe_count: 11,9
algorithm: bicubic
speed: 150
horizontal_move_z: 10
mesh_min: 33, 16
mesh_max: 397, 397
fade_start: 1.0
fade_end: 10.0

[temperature_sensor raspberry_pi]
sensor_type: temperature_host

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
#sensor_temperature1: 25
#sensor_adc1: 0.210317

[mcu CB1]  # Keep if using CB1/RPi for host
serial: /tmp/klipper_host_mcu

[adxl345]
cs_pin: CB1:None
spi_bus: spidev1.1
spi_speed: 5000000
axes_map: z,y,-x

[resonance_tester]
accel_chip: adxl345
probe_points:
    215, 215, 20
accel_per_hz: 50
max_smoothing: 0.2

[input_shaper]
# Known-good HDR Maxout baseline from the upgraded X/Y motor, SKR 3 EZ,
# and TMC5160 Pro machine. Re-run CALIBRATE_SHAPER after mechanical changes.
shaper_type_x: ei
shaper_freq_x: 50.0
shaper_type_y: ei
shaper_freq_y: 40.2

[gcode_arcs]
resolution: 0.5

########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PC5, EXP1_3=PB1, EXP1_5=PE9,  EXP1_7=PE11, EXP1_9=<GND>,
    EXP1_2=PB0, EXP1_4=PE8, EXP1_6=PE10, EXP1_8=PE12, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=PA6, EXP2_3=PE7, EXP2_5=PB2, EXP2_7=PC4,   EXP2_9=<GND>,
    EXP2_2=PA5, EXP2_4=PA4, EXP2_6=PA7, EXP2_8=<RST>, EXP2_10=<NC>

# See the sample-lcd.cfg file for definitions of common LCD displays.

########################################
# TMC5160 configuration (SPI mode)
########################################

[tmc5160 stepper_x]
cs_pin: PD5
spi_software_miso_pin: PE15
spi_software_mosi_pin: PE13
spi_software_sclk_pin: PE14
run_current: 1.0
hold_current: 0.5
sense_resistor: 0.075
interpolate: true
stealthchop_threshold: 999999

[tmc5160 stepper_y]
cs_pin: PD0
spi_software_miso_pin: PE15
spi_software_mosi_pin: PE13
spi_software_sclk_pin: PE14
run_current: 1.6
hold_current: 0.7
sense_resistor: 0.075
interpolate: true
stealthchop_threshold: 999999

[tmc5160 stepper_z]
cs_pin: PE1
spi_software_miso_pin: PE15
spi_software_mosi_pin: PE13
spi_software_sclk_pin: PE14
run_current: 0.8
hold_current: 0.5
sense_resistor: 0.075
interpolate: true
stealthchop_threshold: 999999

[tmc5160 extruder]
cs_pin: PC6
spi_software_miso_pin: PE15
spi_software_mosi_pin: PE13
spi_software_sclk_pin: PE14
run_current: 0.8
hold_current: 0.4
sense_resistor: 0.075
interpolate: true
stealthchop_threshold: 999999

