# Neptune 3 Max custom KAMP configuration.
# The updater-managed KAMP/ directory remains untouched.

[include custom/kamp/Adaptive_Meshing.cfg]
[include custom/kamp/Line_Purge.cfg]
[include custom/kamp/Smart_Park.cfg]

[gcode_macro _KAMP_Settings]
description: Shared settings for adaptive meshing, purge, and parking

variable_verbose_enable: True
variable_mesh_margin: 5
variable_fuzz_amount: 0
variable_probe_dock_enable: False
variable_attach_macro: 'Attach_Probe'
variable_detach_macro: 'Dock_Probe'
variable_purge_height: 0.8
variable_tip_distance: 8
variable_purge_margin: 18
variable_purge_amount: 75
variable_flow_rate: 18
variable_smart_park_height: 10

gcode:
    {action_respond_info("_KAMP_Settings only stores configuration values.")}

