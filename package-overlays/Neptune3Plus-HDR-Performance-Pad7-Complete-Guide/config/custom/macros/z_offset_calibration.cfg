[gcode_macro MANUAL_Z_OFFSET_ADJUST]
description: Clean nozzle, then calibrate Z offset. BED_TEMP=0 TEMP=230 PURGE_AMOUNT=30
gcode:
    {% set bed_temp = params.BED_TEMP|default(0)|float %}
    {% set clean_temp = params.TEMP|default(230)|float %}
    {% set purge_amount = params.PURGE_AMOUNT|default(30)|float %}
    {% set max_clean_temp = printer.configfile.settings.extruder.max_temp|float - 5.0 %}
    {% set max_bed_temp = printer.configfile.settings.heater_bed.max_temp|float - 5.0 %}
    {% set saved_z_offset = printer.configfile.settings.probe.z_offset|float %}
    {% set xmin = printer.toolhead.axis_minimum.x|float %}
    {% set ymin = printer.toolhead.axis_minimum.y|float %}
    {% set ymax = printer.toolhead.axis_maximum.y|float %}
    {% set clean_x = [xmin + 10.0, 10.0]|max %}
    {% set clean_y_start = [ymin + 20.0, 20.0]|max %}
    {% set clean_y_end = [clean_y_start + 100.0, ymax - 20.0]|min %}
    {% set calibration_x = printer.configfile.settings.safe_z_home.home_xy_position[0]|float %}
    {% set calibration_y = printer.configfile.settings.safe_z_home.home_xy_position[1]|float %}

    {% if bed_temp < 0 or bed_temp > max_bed_temp %}
        {action_raise_error("BED_TEMP must be between 0 and %.0f C." % max_bed_temp)}
    {% elif clean_temp < 170 or clean_temp > max_clean_temp %}
        {action_raise_error("TEMP must be between 170 and %.0f C." % max_clean_temp)}
    {% elif purge_amount < 5 or purge_amount > 60 %}
        {action_raise_error("PURGE_AMOUNT must be between 5 and 60 mm.")}
    {% else %}
        {action_respond_info("Current saved probe z_offset: %.3f mm" % saved_z_offset)}
        {action_respond_info("Z setup targets: bed %.0f C, nozzle %.0f C." % (bed_temp, clean_temp))}

        BED_MESH_CLEAR
        M140 S{bed_temp}
        M117 Homing for Z calibration
        G28

        {% if bed_temp > 0 %}
            M117 Heating bed for Z calibration
            M190 S{bed_temp}
        {% endif %}

        M117 Heating nozzle for cleaning
        M109 S{clean_temp}

        SAVE_GCODE_STATE NAME=Z_OFFSET_CLEAN_STATE
        G90
        # Establish clearance before traveling to the left-side purge area.
        G0 Z10 F600
        G0 X{clean_x} Y{clean_y_start} F6000
        G0 Z0.8 F600
        M83
        G92 E0
        G1 E5 F180
        G1 Y{clean_y_end} E{purge_amount} F600
        G1 E-1.0 F1800

        # Switch the heater off immediately, wipe the purge tail, and lift.
        M104 S0
        G0 Y{clean_y_end + 10.0} F3000
        G0 Y{clean_y_end - 5.0} F2400
        G0 Y{clean_y_end + 12.0} F2400
        G0 Z10 F600

        # Return to the same safe-center nozzle position used by homing.
        G0 X{calibration_x} Y{calibration_y} F6000
        RESTORE_GCODE_STATE NAME=Z_OFFSET_CLEAN_STATE

        M107
        {action_respond_info("Purge and wipe complete. Opening the TESTZ adjustment panel now.")}
        M117 Opening Z adjustment controls
        # Start calibration after this preparation macro has fully returned.
        # Launching it independently keeps Mainsail in manual-probe mode so the
        # TESTZ up/down, ACCEPT, and ABORT controls remain available.
        UPDATE_DELAYED_GCODE ID=_BEGIN_Z_OFFSET_CALIBRATION DURATION=1
    {% endif %}

[delayed_gcode _BEGIN_Z_OFFSET_CALIBRATION]
gcode:
    PROBE_CALIBRATE

