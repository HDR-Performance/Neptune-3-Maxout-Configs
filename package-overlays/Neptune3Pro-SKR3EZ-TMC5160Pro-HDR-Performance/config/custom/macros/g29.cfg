[gcode_macro G29]
description: Heat and create a full bed mesh. BED_TEMP=60 NOZZLE_TEMP=190
gcode:
    {% set bed_temp = params.BED_TEMP|default(60)|float %}
    {% set nozzle_temp = params.NOZZLE_TEMP|default(190)|float %}
    {% set bed_max = printer.configfile.settings.heater_bed.max_temp|float - 5.0 %}
    {% set nozzle_max = printer.configfile.settings.extruder.max_temp|float - 5.0 %}
    {% if bed_temp < 0 or bed_temp > bed_max %}
        {action_raise_error("BED_TEMP must be between 0 and %.0f C." % bed_max)}
    {% elif nozzle_temp < 0 or nozzle_temp > nozzle_max %}
        {action_raise_error("NOZZLE_TEMP must be between 0 and %.0f C." % nozzle_max)}
    {% else %}
        M140 S{bed_temp}
        M104 S0
        G28
        M117 Heating bed for full mesh
        M190 S{bed_temp}
        M117 Heating nozzle for full mesh
        M109 S{nozzle_temp}
        BED_MESH_CLEAR
        BED_MESH_CALIBRATE
        M104 S0
        M140 S0
        M117 Full bed mesh complete
    {% endif %}

